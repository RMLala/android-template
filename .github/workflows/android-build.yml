name: Android build API23/API29

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Debug
        run: gradle --no-daemon :app:assembleApi23Debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-api23
          path: app/build/outputs/apk/api23/debug/*.apk
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify secret presence
        shell: bash
        run: |
          for key in KEYSTORE_BASE64 KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!key}" ]; then echo "::error::Required signing secret missing: $key"; exit 1; fi
          done
      - name: Build signed Release variants
        run: gradle --no-daemon :app:assembleApi23Release :app:assembleApi29Release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-api23
          path: app/build/outputs/apk/api23/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-api29
          path: app/build/outputs/apk/api29/release/*.apk
          if-no-files-found: error
